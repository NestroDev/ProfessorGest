name: Deploy ProfessorGest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate application
        run: npm run qa

      - name: Configure optional public API
        env:
          PROFESSORGEST_API_BASE_URL: ${{ vars.PROFESSORGEST_API_BASE_URL }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          base = os.environ.get('PROFESSORGEST_API_BASE_URL', '').strip().rstrip('/')
          Path('frontend/api-config.js').write_text(
              f"globalThis.PROFESSORGEST_API_BASE_URL = {json.dumps(base)};\n",
              encoding='utf-8'
          )
          print('Optional backend:', 'configured' if base else 'disabled (GitHub Pages standalone)')
          PY

      - name: Inject optional Google Drive API key
        env:
          GOOGLE_API_KEY: ${{ secrets.PROFESSORGEST_GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "Google Drive API key not configured; Drive remains optional/off."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import json

          path = Path('frontend/google-drive-config.js')
          text = path.read_text(encoding='utf-8')
          key = os.environ['GOOGLE_API_KEY']
          encoded = json.dumps(key, ensure_ascii=False)

          marker = "  apiKey: '',"
          replacement = f"  apiKey: {encoded},"
          if marker not in text:
              raise SystemExit('The expected public Google Drive config stub was not found.')

          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Build GitHub Pages artifact
        run: npm run build:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
